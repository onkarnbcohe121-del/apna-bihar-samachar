name: Live TTS Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          for i in 1 2 3; do
            sudo apt-get update -y && sudo apt-get install -y ffmpeg && break || sleep 20
          done
          pip install google-genai

      - name: Live TTS test chalao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          if [ -f live-tts-test/live_tts_test_multi.py ]; then
            python live-tts-test/live_tts_test_multi.py
          else
            python live-tts-test/live_tts_test.py
          fi
          echo "script exit: $?"
          for w in live-tts-test/output/*_live_test.wav; do
            [ -f "$w" ] || continue
            ffmpeg -y -i "$w" -codec:a libmp3lame -b:a 128k "${w%.wav}.mp3"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "${w%.wav}.mp3"
          done
          ls -la live-tts-test/output/ || true

      - name: Result repo me commit karo
        run: |
          git config user.name "apna-bihar-bot"
          git config user.email "bot@apnabihar.local"
          git add live-tts-test/output/
          git commit -m "Live TTS test result" || echo "nothing to commit"
          git push || true
