name: Live TTS Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          for i in 1 2 3; do
            sudo apt-get update -y && sudo apt-get install -y ffmpeg && break || sleep 20
          done
          pip install google-genai

      - name: Live TTS test chalao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python live-tts-test/live_tts_test.py
          echo "script exit: $?"
          if [ -f live-tts-test/output/sulafat_live_test.wav ]; then
            ffmpeg -y -i live-tts-test/output/sulafat_live_test.wav -codec:a libmp3lame -b:a 128k live-tts-test/output/sulafat_live_test.mp3
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 live-tts-test/output/sulafat_live_test.mp3
            ffmpeg -i live-tts-test/output/sulafat_live_test.mp3 -af volumedetect -f null /dev/null 2>&1 | grep -E "mean_volume|max_volume" || true
          fi
          ls -la live-tts-test/output/ || true

      - name: Result repo me commit karo
        run: |
          git config user.name "apna-bihar-bot"
          git config user.email "bot@apnabihar.local"
          git add live-tts-test/output/
          git commit -m "Live TTS test result" || echo "nothing to commit"
          git push || true
