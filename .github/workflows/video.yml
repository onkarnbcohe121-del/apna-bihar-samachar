name: TRE Objective Video

on:
  schedule:
    - cron: "30 1 * * *"   # subah 07:00 IST
    - cron: "30 7 * * *"   # dopahar 13:00 IST
    - cron: "30 13 * * *"  # shaam 19:00 IST
  workflow_dispatch:
    inputs:
      count:
        description: "Kitne sawalon ka video"
        default: "50"
      send_to:
        description: "both / channel / personal / none"
        default: "none"
      save_state:
        description: "State aage badhana hai? 1 = haan, 0 = nahi (test ke liye 0)"
        default: "1"
      yt_privacy:
        description: "YouTube privacy: public / unlisted / private"
        default: "public"

permissions:
  contents: write

concurrency:
  group: tre-video

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts pillow requests google-api-python-client google-auth

      - name: Video banao aur Telegram par bhejo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
          COUNT: ${{ inputs.count || '50' }}
          SEND_TO: ${{ inputs.send_to || 'none' }}
          SAVE_STATE: ${{ inputs.save_state || '1' }}
          TMPDIR: ${{ github.workspace }}/tmpwork
        run: |
          mkdir -p tmpwork
          python video.py

      - name: YouTube par upload karo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.yt_privacy || 'public' }}
        run: |
          VIDEO_FILE=$(ls tmpwork/trevid_*/final.mp4 | head -1)
          THUMB_FILE=$(ls tmpwork/trevid_*/thumb.jpg | head -1)
          DATE_STR=$(TZ=Asia/Kolkata date '+%d %b %Y')
          export VIDEO_FILE THUMB_FILE
          export YT_PLAYLIST_ID=$(cat playlist_id.txt 2>/dev/null || echo "")
          QSTART=$(python3 -c "import json; print(json.load(open('video_state.json')).get('q_start', 1))")
          QEND=$(python3 -c "import json; s=json.load(open('video_state.json')); b=json.load(open('questions.json')); n=min(${{ inputs.count || '50' }}, len(b)-s.get('next_index', 0)); print(s.get('q_start', 1) + max(n, 1) - 1)")
          export YT_TITLE="BPSC TRE 4.0 | Questions $QSTART-$QEND with Answers | $DATE_STR | Apna Bihar Samachar"
          export YT_DESC="BPSC TRE 4.0 — 50 important objective questions with answers and explanations. New videos daily at 7 AM, 1 PM and 7 PM.
          All questions are based on NCERT Class 6 to 12.
          Telegram: https://t.me/ApnaBiharSamachar
          #BPSCTRE #TRE4 #BiharTeacher #MCQ #ApnaBiharSamachar"
          python youtube_upload.py | tee upload.log
          grep -o 'https://youtu.be/[A-Za-z0-9_-]*' upload.log | tail -1 > latest_video.txt || true

      - name: State wapas commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add video_state.json latest_video.txt || true
          git diff --cached --quiet || git commit -m "video state update"
          git push || true
