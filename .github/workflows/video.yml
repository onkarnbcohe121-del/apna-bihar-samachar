name: TRE Objective Video

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Kitne sawalon ka video"
        default: "50"
      send_to:
        description: "both / channel / personal / none"
        default: "both"
      save_state:
        description: "State aage badhana hai? 1 = haan, 0 = nahi (test ke liye 0)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: tre-video

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts pillow requests

      - name: Video banao aur Telegram par bhejo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
          COUNT: ${{ inputs.count || '50' }}
          SEND_TO: ${{ inputs.send_to || 'both' }}
          SAVE_STATE: ${{ inputs.save_state || '1' }}
        run: python video.py

      - name: State wapas commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add video_state.json || true
          git diff --cached --quiet || git commit -m "video state update"
          git push || true
