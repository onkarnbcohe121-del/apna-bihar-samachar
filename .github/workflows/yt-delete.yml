name: YT Delete (one-time)

on:
  workflow_dispatch:

jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Duplicate video + playlist safai
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds = Credentials(None, refresh_token=os.environ["YT_REFRESH_TOKEN"],
                              token_uri="https://oauth2.googleapis.com/token",
                              client_id=os.environ["YT_CLIENT_ID"],
                              client_secret=os.environ["YT_CLIENT_SECRET"],
                              scopes=["https://www.googleapis.com/auth/youtube"])
          yt = build("youtube", "v3", credentials=creds)
          for vid in ["yQA3Xrnl-vg"]:
              try:
                  yt.videos().delete(id=vid).execute()
                  print("DELETE_OK", vid)
              except Exception as e:
                  print("DELETE_FAIL", vid, repr(e)[:200])
          REMOVE = {"yQA3Xrnl-vg", "704PicBaPnM", "_ybR6fXLSA0"}
          token = None
          while True:
              resp = yt.playlistItems().list(part="snippet", playlistId="PLPSqiuQaJy9c", maxResults=50, pageToken=token).execute()
              for it in resp.get("items", []):
                  vid = it["snippet"]["resourceId"]["videoId"]
                  if vid in REMOVE:
                      try:
                          yt.playlistItems().delete(id=it["id"]).execute()
                          print("PLAYLIST_REMOVE_OK", vid)
                      except Exception as e:
                          print("PLAYLIST_REMOVE_FAIL", vid, repr(e)[:200])
              token = resp.get("nextPageToken")
              if not token:
                  break
          PY
