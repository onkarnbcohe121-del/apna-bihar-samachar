name: SLET Book Promo Video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-promo
  cancel-in-progress: false

jobs:
  make-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra > /dev/null
          pip install --quiet pillow
      - name: Promo video banao (Leda voice)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python promo/book_promo.py
      - name: Video file artifact me bachao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slet-book-promo
          path: promo_out/slet_book_promo.mp4
          retention-days: 3
          if-no-files-found: warn
