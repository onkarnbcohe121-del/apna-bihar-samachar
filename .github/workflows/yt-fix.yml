name: YT Fix (one-time)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Thumbnail aur description fix karo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_ID: yf7Cl2DNixs
        run: |
          python3 - <<'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(token=None, refresh_token=os.environ["YT_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YT_CLIENT_ID"], client_secret=os.environ["YT_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"])
          yt = build("youtube", "v3", credentials=creds)
          vid = os.environ["VIDEO_ID"]

          # 1) Thumbnail (51 - 100 wala)
          try:
              yt.thumbnails().set(videoId=vid, media_body=MediaFileUpload("thumb_fix.jpg")).execute()
              print("THUMB_FIX_OK")
          except Exception as e:
              print("THUMB_FIX_FAIL:", str(e)[:300])

          # 2) Description English me (title/category/tags purane wale hi rakhenge)
          try:
              cur = yt.videos().list(part="snippet", id=vid).execute()["items"][0]["snippet"]
              cur["description"] = (
                  "BPSC TRE 4.0 - 50 important objective questions with answers and explanations. "
                  "New videos daily at 7 AM, 1 PM and 7 PM.\n"
                  "All questions are based on NCERT Class 6 to 12.\n"
                  "Telegram: https://t.me/ApnaBiharSamachar\n"
                  "#BPSCTRE #TRE4 #BiharTeacher #MCQ #ApnaBiharSamachar")
              yt.videos().update(part="snippet", body={"id": vid, "snippet": cur}).execute()
              print("DESC_FIX_OK")
          except Exception as e:
              print("DESC_FIX_FAIL:", str(e)[:300])
          print("FIX_DONE")
          EOF
