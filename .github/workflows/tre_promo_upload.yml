name: TRE Books Promo — Upload Only

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tre-promo
  cancel-in-progress: false

jobs:
  upload-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra > /dev/null
          pip install --quiet pillow fonttools google-api-python-client google-auth
      - name: Bana hua video artifact se lo (run 42096202868)
        uses: actions/download-artifact@v4
        with:
          name: tre-books-promo
          run-id: 42096202868
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: promo_out
      - name: Title, description aur thumbnail taiyaar karo
        run: python promo/tre_promo.py --slides-only
      - name: YouTube par upload karo (Public)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_FILE: promo_out/tre_books_promo.mp4
          THUMB_FILE: promo_out/tre_thumb.png
          YT_PRIVACY: public
        run: |
          ls -la promo_out/
          export YT_TITLE="$(cat promo_out/title.txt)"
          export YT_DESC="$(cat promo_out/desc.txt)"
          python youtube_upload.py
