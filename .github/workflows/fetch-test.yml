name: Fetch Test Video (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts pillow requests

      - name: Test video banao (3 sawal, bhejna nahi — sirf file)
        env:
          COUNT: "3"
          SEND_TO: "none"
          SAVE_STATE: "0"
          START_INDEX: "38"
          TMPDIR: ${{ github.workspace }}/tmpwork
        run: |
          mkdir -p tmpwork test-videos
          python video.py
          cp tmpwork/trevid_*/final.mp4 test-videos/test.mp4
          ls -la test-videos/

      - name: Test video repo me commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add test-videos/test.mp4
          git commit -m "Test video file (3 sawal, natural awaaz)"
          git push
