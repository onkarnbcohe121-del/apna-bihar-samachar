name: Shorts Leda Sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts pillow

      - name: Leda wala Short banao (Q1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p shorts_samples
          python shorts_maker_leda.py 1 shorts_samples/sample_leda_q1.mp4
          ls -la shorts_samples/

      - name: Sample wapas commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add shorts_samples/
          git diff --cached --quiet || git commit -m "Shorts leda sample Q1"
          git push || true
