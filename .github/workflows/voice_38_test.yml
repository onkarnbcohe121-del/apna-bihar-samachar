name: Gemini 3.8 TTS Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test38:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Leda sample banao (3.8 Flash TTS)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python voice_38_test.py
      - name: Sample artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-38-test
          path: voice_samples/sample_Leda_38.mp3
          retention-days: 3
          if-no-files-found: warn
      - name: Sample repo me commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add voice_samples/sample_Leda_38.mp3 || true
          git diff --cached --quiet || git commit -m "gemini 3.8 leda test sample"
          git push || true
