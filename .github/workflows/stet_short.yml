name: STET News Short

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stet-short
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra > /dev/null
          pip install --quiet edge-tts pillow fonttools google-api-python-client google-auth
      - name: STET Short banao (Swara + music)
        run: python stet_short_maker.py stet_out/stet_short.mp4
      - name: File artifact me bachao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stet-short
          path: |
            stet_out/stet_short.mp4
            stet_out/stet_thumb.png
          retention-days: 3
          if-no-files-found: warn
      - name: Short YouTube par upload karo (Public)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_FILE: stet_out/stet_short.mp4
          THUMB_FILE: stet_out/stet_thumb.png
          YT_PRIVACY: public
        run: |
          export YT_TITLE="Bihar STET 2026 — परीक्षा अब 22 नवंबर को! नया Admit Card 12 Nov से #Shorts"
          export YT_DESC="$(cat stet_short_desc.txt)"
          python youtube_upload.py
