name: TRE Books Promo Video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tre-promo
  cancel-in-progress: false

jobs:
  make-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra > /dev/null
          pip install --quiet pillow fonttools google-api-python-client google-auth google-genai
      - name: Promo video banao (Leda voice)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python promo/tre_promo.py
      - name: Video file artifact me bachao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tre-books-promo
          path: promo_out/tre_books_promo.mp4
          retention-days: 3
          if-no-files-found: warn
      - name: YouTube par upload karo (Public)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_FILE: promo_out/tre_books_promo.mp4
          THUMB_FILE: promo_out/tre_thumb.png
          YT_PRIVACY: public
        run: |
          export YT_TITLE="$(cat promo_out/title.txt)"
          export YT_DESC="$(cat promo_out/desc.txt)"
          python youtube_upload.py
