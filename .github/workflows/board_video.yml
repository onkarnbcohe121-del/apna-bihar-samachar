name: Board PYQ Video

on:
  workflow_dispatch:
    inputs:
      bank_file:
        description: "Bank JSON file (repo root), jaise bseb12_physics2026_setE_objective.json"
        required: true
        default: "bseb12_physics2026_setE_objective.json"
      board_name:
        description: "Board: BSEB / CBSE"
        required: true
        default: "BSEB"
      class_no:
        description: "Class: 10 / 12"
        required: true
        default: "12"
      subject:
        description: "Subject: Physics / Chemistry / Biology / Maths ..."
        required: true
        default: "Physics"
      year:
        description: "Paper ka saal"
        required: true
        default: "2026"
      playlist_year:
        description: "Class playlist ID (BSEB Class 12 PYQ = PLQLEcLWRBOik)"
        required: true
        default: "PLQLEcLWRBOik"
      playlist_subject:
        description: "Subject playlist ID (optional — khaali chhodo to sirf class playlist)"
        required: false
        default: ""
      yt_privacy:
        description: "YouTube privacy: public / unlisted / private"
        default: "public"

permissions:
  contents: write

concurrency:
  group: board-video

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install edge-tts pillow google-api-python-client google-auth google-genai

      - name: Board PYQ video banao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BANK_FILE: ${{ inputs.bank_file }}
          BOARD_NAME: ${{ inputs.board_name }}
          CLASS_NO: ${{ inputs.class_no }}
          SUBJECT: ${{ inputs.subject }}
          YEAR: ${{ inputs.year }}
          PLAYLIST_YEAR: ${{ inputs.playlist_year }}
          PLAYLIST_SUBJECT: ${{ inputs.playlist_subject }}
          TMPDIR: ${{ github.workspace }}/tmpwork
        run: |
          mkdir -p tmpwork
          python board_video.py

      - name: Video file artifact me bachao (upload fail ho to bhi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-video
          path: |
            tmpwork/board_*/final.mp4
            tmpwork/board_*/thumb.jpg
            tmpwork/board_*/title.txt
            tmpwork/board_*/desc.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: YouTube par upload karo (class playlist ke saath)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.yt_privacy || 'public' }}
          YT_PLAYLIST_ID: ${{ inputs.playlist_year }}
        run: |
          VIDEO_FILE=$(ls tmpwork/board_*/final.mp4 | head -1)
          THUMB_FILE=$(ls tmpwork/board_*/thumb.jpg | head -1)
          YT_TITLE=$(cat tmpwork/board_*/title.txt)
          YT_DESC=$(cat tmpwork/board_*/desc.txt)
          export VIDEO_FILE THUMB_FILE YT_TITLE YT_DESC
          python youtube_upload.py | tee upload.log
          grep -o 'https://youtu.be/[A-Za-z0-9_-]*' upload.log | tail -1 > board_latest.txt || true

      - name: Subject playlist me bhi jodo (sirf ID diya ho to)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUBJECT_PLAYLIST: ${{ inputs.playlist_subject }}
        run: |
          VID=$(grep -o 'YOUTUBE_VIDEO_ID: [A-Za-z0-9_-]*' upload.log | tail -1 | awk '{print $2}')
          echo "Video ID: $VID"
          VID_ID=$VID python - << 'PYEOF2'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          vid = os.environ.get("VID_ID", "")
          pid = os.environ.get("SUBJECT_PLAYLIST", "")
          if not vid or not pid:
              print("Video ID ya subject playlist nahi — subject playlist skip")
              raise SystemExit(0)
          creds = Credentials(None, refresh_token=os.environ["YT_REFRESH_TOKEN"],
                              token_uri="https://oauth2.googleapis.com/token",
                              client_id=os.environ["YT_CLIENT_ID"],
                              client_secret=os.environ["YT_CLIENT_SECRET"])
          yt = build("youtube", "v3", credentials=creds)
          yt.playlistItems().insert(part="snippet", body={"snippet": {
              "playlistId": pid, "resourceId": {"kind": "youtube#video", "videoId": vid}}}).execute()
          print("SUBJECT_PLAYLIST_ADD_OK")
          PYEOF2

      - name: Latest link commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add board_latest.txt || true
          git diff --cached --quiet || git commit -m "board latest update"
          git push || true
