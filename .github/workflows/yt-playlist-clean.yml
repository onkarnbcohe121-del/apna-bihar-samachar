name: YT Playlist Clean (one-time)

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Delete hue video playlist se hatao
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds = Credentials(None, refresh_token=os.environ["YT_REFRESH_TOKEN"],
                              token_uri="https://oauth2.googleapis.com/token",
                              client_id=os.environ["YT_CLIENT_ID"],
                              client_secret=os.environ["YT_CLIENT_SECRET"],
                              scopes=["https://www.googleapis.com/auth/youtube"])
          yt = build("youtube", "v3", credentials=creds)
          BAD = {"gD3DsFYUfw0", "BYsVn1EAuoQ", "parvkeVo5pQ"}
          removed = 0
          token = None
          while True:
              r = yt.playlistItems().list(part="snippet", playlistId="PLGeh9EDtxKus", maxResults=50, pageToken=token).execute()
              for it in r.get("items", []):
                  vid = it["snippet"]["resourceId"]["videoId"]
                  if vid in BAD:
                      yt.playlistItems().delete(id=it["id"]).execute()
                      removed += 1
                      print("removed", vid)
              token = r.get("nextPageToken")
              if not token:
                  break
          print("CLEAN_DONE removed:", removed)
          PY
