name: Shorts Sample Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts pillow

      - name: Do sample Shorts banao
        run: |
          python shorts_maker.py 1 shorts_samples/sample_short_q1.mp4
          python shorts_maker.py 21 shorts_samples/sample_short_q21.mp4
          ls -la shorts_samples/

      - name: Samples wapas commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add shorts_samples/
          git diff --cached --quiet || git commit -m "Shorts samples (Q1, Q21)"
          git push || true
