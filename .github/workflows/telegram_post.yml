name: Telegram News Post

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Edition Telegram par post karo (Bot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_sender.py

      - name: Receipt commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add telegram_edition/
          git diff --cached --quiet || git commit -m "Telegram edition posted receipt"
          git push || true
