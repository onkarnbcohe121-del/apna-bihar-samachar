name: Premium Quiz Sample

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-sample
  cancel-in-progress: false

jobs:
  make-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools install karo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra > /dev/null
          pip install --quiet pillow edge-tts requests
      - name: Premium quiz sample banao
        run: python sample_quiz.py
      - name: Sample file artifact me bachao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-sample
          path: sample_out/quiz_sample.mp4
          retention-days: 3
          if-no-files-found: warn
